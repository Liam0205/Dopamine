name: "Auto-sync upstream 2.x"

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/opa334/Dopamine.git || true
          git fetch upstream 2.x --tags

      - name: Fast-forward origin/2.x
        run: |
          git checkout -B 2.x origin/2.x
          git merge --ff-only upstream/2.x
          git push origin 2.x

      - name: Rebase liam-2.x onto 2.x
        id: rebase
        run: |
          git checkout -B liam-2.x origin/liam-2.x
          if git rebase 2.x; then
            git push origin liam-2.x --force-with-lease
            echo "status=success" >> $GITHUB_OUTPUT
          else
            git rebase --abort
            echo "status=conflict" >> $GITHUB_OUTPUT
          fi

      - name: Create issue on conflict
        if: steps.rebase.outputs.status == 'conflict'
        uses: actions/github-script@v7
        with:
          script: |
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'auto-sync-conflict'
            });
            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Auto-sync conflict: liam-2.x rebase onto 2.x failed',
                body: 'The automatic rebase of `liam-2.x` onto the updated `2.x` branch failed due to merge conflicts. Manual resolution is required.\n\nRun:\n```bash\ngit fetch origin\ngit checkout liam-2.x\ngit rebase origin/2.x\n# resolve conflicts\ngit push origin liam-2.x --force-with-lease\n```',
                labels: ['auto-sync-conflict']
              });
            }

      - name: Check for new upstream tag and trigger release
        if: steps.rebase.outputs.status == 'success'
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2.x 2>/dev/null || echo "")
          if [ -n "$LATEST_TAG" ]; then
            HAVE_RELEASE=$(git tag -l "${LATEST_TAG}-[0-9]*" 2>/dev/null | head -1)
            if [ -z "$HAVE_RELEASE" ]; then
              GIT_DESC=$(git describe --tags)
              SUFFIX="${GIT_DESC#${LATEST_TAG}-}"
              TIMESTAMP=$(TZ=Asia/Shanghai date +'%Y%m%d_%H%M')
              NEW_TAG="${LATEST_TAG}-${TIMESTAMP}-${SUFFIX}"
              git tag "$NEW_TAG"
              git push origin "$NEW_TAG"
            fi
          fi
