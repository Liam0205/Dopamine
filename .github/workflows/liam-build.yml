name: "Dopamine (0x01): build and release"

on:
  push:
    branches:
      - 'liam-2.x'
    tags:
      - '[0-9]*'
    paths-ignore:
      - ".gitignore"
      - "*.md"
      - "llmdoc/**"
      - ".llmdoc-tmp/**"
      - ".claude/**"
      - "CLAUDE.md"
      - "AGENTS.md"
  pull_request:
    branches:
      - 'liam-2.x'
    paths-ignore:
      - ".gitignore"
      - "*.md"
      - "llmdoc/**"
      - ".llmdoc-tmp/**"
      - ".claude/**"
      - "CLAUDE.md"
      - "AGENTS.md"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Xcode Setup
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Checkout
        uses: actions/checkout@v4
        with:
            submodules: recursive
            fetch-depth: 0

      - name: Fetch upstream tags
        run: |
          git remote add upstream https://github.com/opa334/Dopamine.git || true
          git fetch upstream --tags

      - name: Install Procursus
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid findutils sed coreutils make

      - name: Install better GNU Make
        run: |
          brew install make
          echo "PATH=$(brew --prefix make)/libexec/gnubin:$PATH" >> $GITHUB_ENV

      - name: Cache THEOS
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: theos
          key: theos-sdk16.5-${{ runner.os }}

      - name: Install THEOS
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          set -x
          export BASEDIR="$(pwd)"
          export THEOS="${BASEDIR}/theos"
          mkdir -p $THEOS
          curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos >> install-theos.sh
          gsed -E "/^\s*get_theos\s*$/,+1 s/^(\s*)(get_sdks)\s*$/\1mkdir -p \${THEOS}\/sdks\n\1touch \${THEOS}\/sdks\/sdk\n\1\2/g" -i install-theos.sh
          bash install-theos.sh
          curl -L https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz --output $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz
          gunzip $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz
          tar -xf $THEOS/sdks/iPhoneOS16.5.sdk.tar -C $THEOS/sdks
          rm $THEOS/sdks/iPhoneOS16.5.sdk.tar
          cd $BASEDIR

      - name: Cache trustcache
        id: cache-trustcache
        uses: actions/cache@v4
        with:
          path: trustcache/trustcache
          key: trustcache-${{ runner.os }}-${{ runner.arch }}

      - name: Build and Install trustcache
        if: steps.cache-trustcache.outputs.cache-hit != 'true'
        run: |
          set -x
          git clone https://github.com/CRKatri/trustcache
          cd trustcache
          export CFLAGS="$CFLAGS -I$(brew --prefix openssl)/include -arch arm64"
          export LDFLAGS="$LDFLAGS -L$(brew --prefix openssl)/lib -arch arm64"
          gmake -j$(sysctl -n hw.logicalcpu) OPENSSL=1

      - name: Install trustcache binary
        run: sudo cp trustcache/trustcache /opt/procursus/bin/

      - name: Set Environment Variables
        run: |
          set -x
          T2=$(TZ=Asia/Shanghai date +'%Y%m%d_%H%M')
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            BASE_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
            GIT_DESC=$(git describe --tags 2>/dev/null || echo "")
            if [ -n "$GIT_DESC" ] && [ "$GIT_DESC" != "$BASE_TAG" ]; then
              SUFFIX="${GIT_DESC#${BASE_TAG}-}"
              VERSION="${BASE_TAG}-${T2}-${SUFFIX}"
            else
              VERSION="${BASE_TAG}-${T2}"
            fi
          fi
          echo "ctime=${T2}" >> $GITHUB_ENV
          echo "version=${VERSION}" >> $GITHUB_ENV

      - name: Install libarchive
        run: |
          brew install libarchive

      - name: Download Bootstraps
        run: |
            set -x
            cd Application/Dopamine/Resources
            ./download_bootstraps.sh

      - name: Build
        run: |
          set -x
          export BASEDIR="$(pwd)"
          export THEOS="${BASEDIR}/theos"
          export COMPILE_TIME="${ctime}"
          export DOPAMINE_VERSION="${version}"
          gmake -j$(sysctl -n hw.logicalcpu) NIGHTLY=1

      - name: Rename artifacts
        run: |
          mv Application/Dopamine.ipa "Application/Dopamine-${version}.ipa"
          mv Application/Dopamine.tipa "Application/Dopamine-${version}.tipa"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dopamine-0x01-${{ env.version }}
          path: |
            ${{ github.workspace }}/Application/Dopamine-${{ env.version }}.ipa
            ${{ github.workspace }}/Application/Dopamine-${{ env.version }}.tipa

      - name: Generate Release Notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          BASE_TAG=$(echo "$TAG" | sed 's/-[0-9]\{8\}_.*//')
          NOTES=$(git log --pretty=format:"- %s" ${BASE_TAG}..HEAD)
          {
            echo "release_notes<<EOFNOTES"
            echo "$NOTES"
            echo "EOFNOTES"
          } >> $GITHUB_ENV

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Dopamine (0x01) ${{ env.version }}
          body: ${{ env.release_notes }}
          files: |
            Application/Dopamine-${{ env.version }}.ipa
            Application/Dopamine-${{ env.version }}.tipa
